<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Text Cleaner & Word Counter</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 780px;
      background: #1e293b;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    h1 { margin: 0 0 6px; font-size: 22px; color: #f8fafc; }
    p.sub { margin: 0 0 18px; font-size: 14px; color: #94a3b8; }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat-box {
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-num { font-size: 20px; font-weight: bold; color: #38bdf8; }
    .stat-label { font-size: 12px; color: #94a3b8; margin-top: 2px; }
    textarea {
      width: 100%;
      height: 240px;
      background: #0f172a;
      color: #f1f5f9;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      line-height: 1.5;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: #38bdf8; }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }
    button {
      background: #334155;
      color: #f8fafc;
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #475569; }
    button.primary { background: #0284c7; }
    button.primary:hover { background: #0369a1; }
    button.danger { background: #991b1b; }
    button.danger:hover { background: #7f1d1d; }
    @media (max-width: 550px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Quick Text Cleaner & Counter</h1>
    <p class="sub">Paste any messy text below to clean formatting, fix PDF line breaks, or count words.</p>

    <div class="stats">
      <div class="stat-box"><div class="stat-num" id="words">0</div><div class="stat-label">Words</div></div>
      <div class="stat-box"><div class="stat-num" id="chars">0</div><div class="stat-label">Characters</div></div>
      <div class="stat-box"><div class="stat-num" id="noSpaces">0</div><div class="stat-label">No Spaces</div></div>
      <div class="stat-box"><div class="stat-num" id="readTime">0s</div><div class="stat-label">Read Time</div></div>
    </div>

    <textarea id="input" placeholder="Paste or type your text here..."></textarea>

    <div class="buttons">
      <button onclick="fixPdfBreaks()">Fix PDF Line Breaks</button>
      <button onclick="cleanSpaces()">Remove Extra Spaces</button>
      <button onclick="removeDuplicates()">Remove Duplicate Lines</button>
      <button onclick="toSentenceCase()">Sentence case</button>
      <button onclick="toTitleCase()">Title Case</button>
      <button onclick="toUpper()">UPPERCASE</button>
      <button onclick="toLower()">lowercase</button>
      <button class="primary" id="copyBtn" onclick="copyText()">Copy Text</button>
      <button class="danger" onclick="clearText()">Clear</button>
    </div>
  </div>

  <script>
    const input = document.getElementById('input');

    function updateStats() {
      const text = input.value;
      const trimmed = text.trim();
      const wordCount = trimmed ? trimmed.split(/\s+/).length : 0;
      const charCount = text.length;
      const noSpaceCount = text.replace(/\s/g, '').length;

      const seconds = Math.round((wordCount / 200) * 60);
      let timeText = seconds + 's';
      if (seconds >= 60) {
        const mins = Math.ceil(seconds / 60);
        timeText = mins + 'm';
      }

      document.getElementById('words').textContent = wordCount;
      document.getElementById('chars').textContent = charCount;
      document.getElementById('noSpaces').textContent = noSpaceCount;
      document.getElementById('readTime').textContent = wordCount === 0 ? '0s' : timeText;
    }

    input.addEventListener('input', updateStats);

    function fixPdfBreaks() {
      input.value = input.value
        .replace(/\r\n/g, '\n')
        .replace(/([^\n])\n([^\n])/g, '$1 $2')
        .replace(/[ \t]+/g, ' ')
        .trim();
      updateStats();
    }

    function cleanSpaces() {
      input.value = input.value
        .replace(/[ \t]+/g, ' ')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
      updateStats();
    }

    function removeDuplicates() {
      const lines = input.value.split(/\r?\n/);
      input.value = [...new Set(lines)].join('\n');
      updateStats();
    }

    function toSentenceCase() {
      input.value = input.value
        .toLowerCase()
        .replace(/(^\s*\w|[.!?]\s+\w)/g, c => c.toUpperCase());
      updateStats();
    }

    function toTitleCase() {
      input.value = input.value
        .toLowerCase()
        .replace(/\b\w/g, c => c.toUpperCase());
      updateStats();
    }

    function toUpper() {
      input.value = input.value.toUpperCase();
      updateStats();
    }

    function toLower() {
      input.value = input.value.toLowerCase();
      updateStats();
    }

    function copyText() {
      if (!input.value) return;
      input.select();
      try {
        navigator.clipboard.writeText(input.value);
      } catch (e) {
        document.execCommand('copy');
      }
      const btn = document.getElementById('copyBtn');
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy Text', 1500);
    }

    function clearText() {
      input.value = '';
      updateStats();
    }
  </script>
</body>
</html>
